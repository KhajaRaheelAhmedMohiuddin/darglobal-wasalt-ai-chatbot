name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t darglobal-wasalt-chatbot .
      - name: Smoke-test the container
        run: |
          docker run -d --name bot -p 7860:7860 darglobal-wasalt-chatbot
          for i in $(seq 1 30); do curl -fs http://localhost:7860/api/health && exit 0; sleep 2; done
          docker logs bot
          exit 1
